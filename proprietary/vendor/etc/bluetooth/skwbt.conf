# RELEASE NAME: 20210721_BT_ANDROID_10.0
# Bluetooth Device Name
#Name=SeekWave Bluetooth

#Indicate USB/SDIO or UART driver bluetooth
BtDeviceNode=/dev/BTCMD
BtDeviceNode=/dev/BTDATA
BtDeviceNode=/dev/BTAUDIO
BtDeviceNode=/dev/BTISOC
#BtDeviceNode=?/dev/ttyS0

# Enable BtSnoop logging function
# valid value : true, false
SkwBtUartOnly=false
#SkwBtNoSleep:just for uart mode
SkwBtNoSleep=false
SkwBtsnoopDump=false
SkwBtcplog=false
SkwBtDrvlog=false

####WakeupADVData=gpio No;effactive level;addr offset;ADVData;Mask  ### ADVData size must be equal Mask size
#WakeupADVData=16;1;0;020106031980010FFF00112233AABBCCDD;0000FF0000FFFFFF000000000000000000
WakeupADVData=4;0;19;020104030312180319C1030DFF5D0003000104FFEEDDCCBBAA;000000000000000000FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF

# BtSnoop log output file
BtSnoopFileName=/data/misc/bluedroid/btsnoop_hci.cfa


# Preserve existing BtSnoop log before overwriting
BtSnoopSaveLog=true
SkwLogSlice=true
